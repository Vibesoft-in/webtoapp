<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%" style="border-radius:12px;background:#FAF8F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2C2621" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="680" height="400" rx="12" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1.5"/>

  <!-- Browser Header -->
  <path d="M0 12 Q0 0 12 0 L668 0 Q680 0 680 12 L680 44 L0 44 Z" fill="#F0EBE1"/>
  <circle cx="24" cy="22" r="5" fill="#D8CFBE"/>
  <circle cx="40" cy="22" r="5" fill="#D8CFBE"/>
  <circle cx="56" cy="22" r="5" fill="#D8CFBE"/>

  <!-- Address Bar -->
  <rect x="80" y="10" width="460" height="24" rx="6" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1"/>
  <text x="96" y="26" font-size="11" fill="#786C5E" font-weight="500">yourstore.com/wp-admin</text>

  <!-- Window Content Background -->
  <rect x="0" y="44" width="680" height="356" fill="#FDFBF9"/>

  <!-- Main Content Layout -->
    <rect x="190" y="80" width="300" height="260" rx="10" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1" filter="url(#shadow)"/>
  <circle cx="340" cy="120" r="22" fill="#78593D"/>
  <text x="340" y="126" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Woo</text>
  <rect x="220" y="160" width="240" height="34" rx="6" fill="#F8F6F2" stroke="#D8CFC2" stroke-width="1"/>
  <text x="232" y="181" font-size="11" fill="#4A4036">Store Admin Email</text>
  <rect x="220" y="210" width="240" height="34" rx="6" fill="#F8F6F2" stroke="#D8CFC2" stroke-width="1"/>
  <text x="232" y="231" font-size="11" fill="#8C8174">Password  ••••••••••••</text>
  <rect x="220" y="265" width="240" height="36" rx="6" fill="#78593D"/>
  <text x="340" y="287" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">Access Store Admin</text>

  <!-- Highlight Overlay / Focus Ring -->
    <rect x="180" y="70" width="320" height="280" rx="14" fill="none" stroke="#B69A78" stroke-width="2.5" stroke-dasharray="4 4"/>
  <rect x="410" y="75" width="160" height="24" rx="12" fill="#B69A78"/>
  <text x="490" y="91" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Administrator / Store Manager</text>
</svg>