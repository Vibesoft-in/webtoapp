<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%" style="border-radius:12px;background:#FAF8F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2C2621" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="680" height="400" rx="12" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1.5"/>

  <!-- Browser Header -->
  <path d="M0 12 Q0 0 12 0 L668 0 Q680 0 680 12 L680 44 L0 44 Z" fill="#F0EBE1"/>
  <circle cx="24" cy="22" r="5" fill="#D8CFBE"/>
  <circle cx="40" cy="22" r="5" fill="#D8CFBE"/>
  <circle cx="56" cy="22" r="5" fill="#D8CFBE"/>

  <!-- Address Bar -->
  <rect x="80" y="10" width="460" height="24" rx="6" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1"/>
  <text x="96" y="26" font-size="11" fill="#786C5E" font-weight="500">yourstore.com/wp-admin/admin.php?page=wc-settings&tab=advanced&section=keys&create-key=1</text>

  <!-- Window Content Background -->
  <rect x="0" y="44" width="680" height="356" fill="#FDFBF9"/>

  <!-- Main Content Layout -->
    <rect x="160" y="65" width="495" height="315" rx="8" fill="#FFFFFF" stroke="#E2DACF" filter="url(#shadow)"/>
  <text x="185" y="98" font-size="15" fill="#252525" font-weight="bold">Key Details</text>
  
  <text x="185" y="128" font-size="11" fill="#5A4E40" font-weight="bold">Description</text>
  <rect x="185" y="136" width="300" height="30" rx="4" fill="#FAF8F5" stroke="#D8CDBE"/>
  <text x="195" y="155" font-size="11" fill="#252525">AppifyHub</text>
  
  <text x="185" y="185" font-size="11" fill="#5A4E40" font-weight="bold">User</text>
  <rect x="185" y="193" width="300" height="30" rx="4" fill="#FAF8F5" stroke="#D8CDBE"/>
  <text x="195" y="212" font-size="11" fill="#252525">Store Manager / Administrator ▾</text>
  
  <text x="185" y="242" font-size="11" fill="#5A4E40" font-weight="bold">Permissions</text>
  <rect x="185" y="250" width="300" height="30" rx="4" fill="#FAF8F5" stroke="#B69A78" stroke-width="1.5"/>
  <text x="195" y="269" font-size="11" fill="#252525" font-weight="bold">Read/Write ▾</text>
  
  <rect x="185" y="295" width="150" height="32" rx="6" fill="#78593D"/>
  <text x="260" y="315" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">Generate API Key</text>

  <!-- Highlight Overlay / Focus Ring -->
    <rect x="180" y="245" width="310" height="40" rx="6" fill="none" stroke="#B69A78" stroke-width="2.5"/>
  <rect x="500" y="250" width="140" height="24" rx="12" fill="#403A32"/>
  <text x="570" y="266" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Set to Read/Write</text>
</svg>