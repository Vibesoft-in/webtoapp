<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%" style="border-radius:12px;background:#FAF8F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2C2621" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="680" height="400" rx="12" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1.5"/>

  <!-- Browser Header -->
  <path d="M0 12 Q0 0 12 0 L668 0 Q680 0 680 12 L680 44 L0 44 Z" fill="#F0EBE1"/>
  <circle cx="24" cy="22" r="5" fill="#D8CFBE"/>
  <circle cx="40" cy="22" r="5" fill="#D8CFBE"/>
  <circle cx="56" cy="22" r="5" fill="#D8CFBE"/>

  <!-- Address Bar -->
  <rect x="80" y="10" width="460" height="24" rx="6" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1"/>
  <text x="96" y="26" font-size="11" fill="#786C5E" font-weight="500">yourstore.com/wp-admin/admin.php?page=wc-settings&tab=advanced&section=keys</text>

  <!-- Window Content Background -->
  <rect x="0" y="44" width="680" height="356" fill="#FDFBF9"/>

  <!-- Main Content Layout -->
    <rect x="0" y="44" width="140" height="356" fill="#2E2822"/>
  <text x="16" y="80" font-size="11" fill="#ECE4DA">WooCommerce</text>
  <text x="16" y="105" font-size="11" fill="#D6C7B2" font-weight="bold">→ Settings</text>
  
  <!-- Sub-navigation -->
  <rect x="160" y="65" width="495" height="40" rx="6" fill="#F5EFE6" stroke="#DDD2C0"/>
  <text x="180" y="89" font-size="11" fill="#786C5E">Page setup</text>
  <rect x="250" y="73" width="75" height="24" rx="4" fill="#FFFFFF" stroke="#B69A78" stroke-width="1.5"/>
  <text x="262" y="89" font-size="11" fill="#403A32" font-weight="bold">REST API</text>
  <text x="345" y="89" font-size="11" fill="#786C5E">Webhooks</text>
  <text x="420" y="89" font-size="11" fill="#786C5E">Legacy API</text>
  
  <rect x="160" y="120" width="495" height="250" rx="8" fill="#FFFFFF" stroke="#E2DACF" filter="url(#shadow)"/>
  <text x="185" y="155" font-size="14" fill="#252525" font-weight="bold">REST API Keys</text>
  <rect x="520" y="137" width="115" height="30" rx="6" fill="#78593D"/>
  <text x="577" y="156" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">+ Add key</text>
  
  <line x1="185" y1="180" x2="635" y2="180" stroke="#EBE2D5"/>
  <text x="185" y="210" font-size="11" fill="#786C5E">Keys allow external apps to sync products &amp; inventory securely.</text>

  <!-- Highlight Overlay / Focus Ring -->
    <rect x="515" y="132" width="125" height="40" rx="8" fill="none" stroke="#B69A78" stroke-width="2.5"/>
  <rect x="360" y="135" width="145" height="24" rx="12" fill="#B69A78"/>
  <text x="432" y="151" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Click "Add key" Button</text>
</svg>