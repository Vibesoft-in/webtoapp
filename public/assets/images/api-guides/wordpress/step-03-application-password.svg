<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%" style="border-radius:12px;background:#FAF8F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2C2621" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="680" height="400" rx="12" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1.5"/>

  <!-- Browser Header -->
  <path d="M0 12 Q0 0 12 0 L668 0 Q680 0 680 12 L680 44 L0 44 Z" fill="#F0EBE1"/>
  <circle cx="24" cy="22" r="5" fill="#D8CFBE"/>
  <circle cx="40" cy="22" r="5" fill="#D8CFBE"/>
  <circle cx="56" cy="22" r="5" fill="#D8CFBE"/>

  <!-- Address Bar -->
  <rect x="80" y="10" width="460" height="24" rx="6" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1"/>
  <text x="96" y="26" font-size="11" fill="#786C5E" font-weight="500">yourwebsite.com/wp-admin/profile.php#application-passwords-section</text>

  <!-- Window Content Background -->
  <rect x="0" y="44" width="680" height="356" fill="#FDFBF9"/>

  <!-- Main Content Layout -->
    <!-- Sidebar Preview -->
  <rect x="0" y="44" width="130" height="356" fill="#2E2822"/>
  <text x="16" y="80" font-size="11" fill="#B5A99B">Users → Profile</text>
  <!-- Main Content -->
  <rect x="160" y="65" width="490" height="310" rx="8" fill="#FFFFFF" stroke="#E5DDD0" filter="url(#shadow)"/>
  <text x="185" y="105" font-size="16" fill="#252525" font-weight="bold">Application Passwords</text>
  <text x="185" y="130" font-size="11" fill="#6E6254">Application passwords allow authentication via HTTP requests.</text>
  <text x="185" y="148" font-size="11" fill="#6E6254">They are completely separate from your personal account password.</text>
  
  <rect x="185" y="170" width="440" height="120" rx="8" fill="#FAF6F0" stroke="#E5DACB"/>
  <text x="205" y="200" font-size="12" fill="#403A32" font-weight="bold">New Application Password Name</text>
  <rect x="205" y="215" width="280" height="34" rx="6" fill="#FFFFFF" stroke="#D1C6B4"/>
  <text x="218" y="236" font-size="11" fill="#9C9082">AppifyHub</text>
  <rect x="205" y="260" width="200" height="30" rx="6" fill="#78593D"/>
  <text x="305" y="279" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">Add New Application Password</text>

  <!-- Highlight Overlay / Focus Ring -->
    <rect x="175" y="85" width="460" height="75" rx="8" fill="none" stroke="#B69A78" stroke-width="2.5" stroke-dasharray="4 4"/>
  <rect x="440" y="88" width="185" height="24" rx="12" fill="#B69A78"/>
  <text x="532" y="104" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Scroll to Bottom of Profile</text>
</svg>