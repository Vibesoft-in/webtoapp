<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%" style="border-radius:12px;background:#FAF8F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2C2621" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="680" height="400" rx="12" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1.5"/>

  <!-- Browser Header -->
  <path d="M0 12 Q0 0 12 0 L668 0 Q680 0 680 12 L680 44 L0 44 Z" fill="#F0EBE1"/>
  <circle cx="24" cy="22" r="5" fill="#D8CFBE"/>
  <circle cx="40" cy="22" r="5" fill="#D8CFBE"/>
  <circle cx="56" cy="22" r="5" fill="#D8CFBE"/>

  <!-- Address Bar -->
  <rect x="80" y="10" width="460" height="24" rx="6" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1"/>
  <text x="96" y="26" font-size="11" fill="#786C5E" font-weight="500">admin.shopify.com/store/your-store</text>

  <!-- Window Content Background -->
  <rect x="0" y="44" width="680" height="356" fill="#FDFBF9"/>

  <!-- Main Content Layout -->
    <!-- Shopify Dark Header -->
  <rect x="0" y="44" width="680" height="40" fill="#1A1A1A"/>
  <rect x="20" y="52" width="24" height="24" rx="4" fill="#4E522C"/>
  <text x="32" y="68" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">S</text>
  <rect x="180" y="52" width="320" height="24" rx="6" fill="#2E2E2E"/>
  <text x="195" y="68" font-size="11" fill="#999999">🔍 Search products, orders, apps...</text>
  
  <!-- Left Sidebar -->
  <rect x="0" y="84" width="160" height="316" fill="#EBE7DF"/>
  <text x="20" y="115" font-size="11" fill="#252525" font-weight="bold">Home</text>
  <text x="20" y="145" font-size="11" fill="#555555">Orders</text>
  <text x="20" y="175" font-size="11" fill="#555555">Products</text>
  <text x="20" y="205" font-size="11" fill="#555555">Customers</text>
  <text x="20" y="235" font-size="11" fill="#555555">Analytics</text>
  <text x="20" y="365" font-size="11" fill="#252525" font-weight="bold">⚙ Settings</text>
  
  <!-- Content Area -->
  <rect x="180" y="105" width="475" height="265" rx="8" fill="#FFFFFF" stroke="#DDD5C7"/>
  <text x="205" y="140" font-size="16" fill="#252525" font-weight="bold">Store Overview</text>

  <!-- Highlight Overlay / Focus Ring -->
    <rect x="10" y="348" width="140" height="30" rx="6" fill="none" stroke="#B69A78" stroke-width="2.5"/>
  <rect x="160" y="348" width="170" height="24" rx="12" fill="#403A32"/>
  <text x="245" y="364" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Bottom Left: Settings</text>
</svg>