<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%" style="border-radius:12px;background:#FAF8F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2C2621" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="680" height="400" rx="12" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1.5"/>

  <!-- Browser Header -->
  <path d="M0 12 Q0 0 12 0 L668 0 Q680 0 680 12 L680 44 L0 44 Z" fill="#F0EBE1"/>
  <circle cx="24" cy="22" r="5" fill="#D8CFBE"/>
  <circle cx="40" cy="22" r="5" fill="#D8CFBE"/>
  <circle cx="56" cy="22" r="5" fill="#D8CFBE"/>

  <!-- Address Bar -->
  <rect x="80" y="10" width="460" height="24" rx="6" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1"/>
  <text x="96" y="26" font-size="11" fill="#786C5E" font-weight="500">admin.shopify.com/store/your-store/settings/apps</text>

  <!-- Window Content Background -->
  <rect x="0" y="44" width="680" height="356" fill="#FDFBF9"/>

  <!-- Main Content Layout -->
    <!-- Settings Modal/View -->
  <rect x="140" y="65" width="510" height="315" rx="8" fill="#FFFFFF" stroke="#E2DACF" filter="url(#shadow)"/>
  <text x="165" y="100" font-size="16" fill="#252525" font-weight="bold">Apps and sales channels</text>
  <text x="165" y="125" font-size="11" fill="#666666">Manage custom apps, sales channels, and API configurations.</text>
  
  <rect x="165" y="145" width="460" height="60" rx="6" fill="#FAF6F0" stroke="#DDD2C0"/>
  <text x="185" y="172" font-size="12" fill="#252525" font-weight="bold">Develop apps</text>
  <text x="185" y="190" font-size="10" fill="#786C5E">Build custom private integrations tailored to your store.</text>
  <rect x="520" y="160" width="90" height="28" rx="5" fill="#4E522C"/>
  <text x="565" y="178" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Develop apps</text>
  
  <rect x="165" y="220" width="460" height="135" rx="6" fill="#FAF8F5" stroke="#E5DDD0"/>
  <text x="185" y="250" font-size="11" fill="#77716D">Installed Sales Channels</text>

  <!-- Highlight Overlay / Focus Ring -->
    <rect x="160" y="140" width="470" height="70" rx="8" fill="none" stroke="#B69A78" stroke-width="2.5"/>
  <rect x="360" y="115" width="160" height="24" rx="12" fill="#B69A78"/>
  <text x="440" y="131" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Click "Develop apps"</text>
</svg>