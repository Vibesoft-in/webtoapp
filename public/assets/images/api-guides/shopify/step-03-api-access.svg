<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%" style="border-radius:12px;background:#FAF8F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2C2621" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="680" height="400" rx="12" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1.5"/>

  <!-- Browser Header -->
  <path d="M0 12 Q0 0 12 0 L668 0 Q680 0 680 12 L680 44 L0 44 Z" fill="#F0EBE1"/>
  <circle cx="24" cy="22" r="5" fill="#D8CFBE"/>
  <circle cx="40" cy="22" r="5" fill="#D8CFBE"/>
  <circle cx="56" cy="22" r="5" fill="#D8CFBE"/>

  <!-- Address Bar -->
  <rect x="80" y="10" width="460" height="24" rx="6" fill="#FFFFFF" stroke="#DDD5C7" stroke-width="1"/>
  <text x="96" y="26" font-size="11" fill="#786C5E" font-weight="500">admin.shopify.com/store/your-store/apps/development</text>

  <!-- Window Content Background -->
  <rect x="0" y="44" width="680" height="356" fill="#FDFBF9"/>

  <!-- Main Content Layout -->
    <rect x="140" y="65" width="510" height="315" rx="8" fill="#FFFFFF" stroke="#E2DACF" filter="url(#shadow)"/>
  <text x="165" y="98" font-size="15" fill="#252525" font-weight="bold">AppifyHub Integration — Configuration</text>
  
  <rect x="165" y="115" width="460" height="180" rx="6" fill="#FAF6F0" stroke="#E5DACB"/>
  <text x="185" y="140" font-size="12" fill="#403A32" font-weight="bold">Admin API access scopes (Only Required Scopes)</text>
  
  <!-- Scopes Checkboxes -->
  <rect x="185" y="155" width="14" height="14" rx="3" fill="#4E522C"/>
  <text x="188" y="166" font-size="10" fill="#FFFFFF">✓</text>
  <text x="208" y="166" font-size="11" fill="#252525" font-weight="600">Products (read_products)</text>
  
  <rect x="185" y="185" width="14" height="14" rx="3" fill="#4E522C"/>
  <text x="188" y="196" font-size="10" fill="#FFFFFF">✓</text>
  <text x="208" y="196" font-size="11" fill="#252525" font-weight="600">Orders (read_orders)</text>
  
  <rect x="185" y="215" width="14" height="14" rx="3" fill="#4E522C"/>
  <text x="188" y="226" font-size="10" fill="#FFFFFF">✓</text>
  <text x="208" y="226" font-size="11" fill="#252525" font-weight="600">Customers (read_customers)</text>

  <rect x="185" y="245" width="14" height="14" rx="3" fill="#4E522C"/>
  <text x="188" y="256" font-size="10" fill="#FFFFFF">✓</text>
  <text x="208" y="256" font-size="11" fill="#252525" font-weight="600">Store data &amp; Content (read_content)</text>

  <rect x="520" y="310" width="105" height="30" rx="5" fill="#4E522C"/>
  <text x="572" y="329" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Install app</text>

  <!-- Highlight Overlay / Focus Ring -->
    <rect x="175" y="130" width="310" height="145" rx="6" fill="none" stroke="#B69A78" stroke-width="2.5"/>
  <rect x="500" y="270" width="145" height="24" rx="12" fill="#B69A78"/>
  <text x="572" y="286" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Grant Read Permissions</text>
</svg>